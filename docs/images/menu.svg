<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="620" height="300" rx="14" fill="#eef2f7"/>

  <!-- the file that was right-clicked -->
  <g transform="translate(40 52)">
    <rect x="6" y="0" width="52" height="66" rx="5" fill="#fff" stroke="#c9d1dc"/>
    <rect x="6" y="40" width="52" height="18" fill="#e5484d"/>
    <text x="32" y="54" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">PDF</text>
    <text x="32" y="88" text-anchor="middle" fill="#1f2937">report.pdf</text>
  </g>
  <!-- mouse pointer -->
  <path d="M96 92 l0 22 l6 -5 l4 9 l4 -2 l-4 -9 l8 0 z" fill="#111" stroke="#fff" stroke-width="1.2"/>

  <!-- right-click menu -->
  <g transform="translate(118 70)" filter="url(#shadow)">
    <rect width="200" height="196" rx="8" fill="#fff" stroke="#dde3ea"/>
  </g>
  <g transform="translate(118 70)" fill="#1f2937">
    <text x="20" y="28">Open</text>
    <text x="20" y="60">Open with</text><text x="182" y="60" text-anchor="end" fill="#6b7280">›</text>
    <text x="20" y="92">Copy</text>
    <text x="20" y="124">Rename</text>
    <line x1="10" y1="140" x2="190" y2="140" stroke="#e5e7eb"/>
    <rect x="6" y="150" width="188" height="34" rx="5" fill="#e8f0fe"/>
    <rect x="16" y="157" width="20" height="20" rx="5" fill="url(#tile)"/>
    <path d="M20 164 h10 m-3 -3 l3 3 l-3 3 M32 170 h-10 m3 -3 l-3 3 l3 3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="172" font-weight="600">Convert</text><text x="182" y="172" text-anchor="end" fill="#374151">›</text>
  </g>

  <!-- submenu with the formats -->
  <g transform="translate(316 186)" filter="url(#shadow)">
    <rect width="150" height="148" rx="8" fill="#fff" stroke="#dde3ea" transform="translate(0 -60)"/>
  </g>
  <g transform="translate(316 126)" fill="#1f2937">
    <rect x="6" y="6" width="138" height="32" rx="5" fill="#e8f0fe"/>
    <text x="20" y="27" font-weight="600">to DOCX</text>
    <text x="20" y="61">to JPG</text>
    <text x="20" y="95">to PNG</text>
    <text x="20" y="129">to TXT</text>
  </g>

  <!-- what happens next -->
  <g transform="translate(486 150)" fill="#374151" font-size="13">
    <text x="0" y="0" font-weight="600" fill="#111827">Then choose:</text>
    <text x="0" y="24">• Replace original</text>
    <text x="0" y="46">• Save a copy…</text>
  </g>
</svg>
